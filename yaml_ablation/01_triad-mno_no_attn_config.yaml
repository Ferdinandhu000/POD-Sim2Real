data:
  use_official_indices: true
  split_mode: official_index
  test_mode: all
  input_steps: 20
  output_steps: 20
  resolution:
  - 64
  - 128
  pod_rank: 64
  pod_fit_samples: 64
  refit_real_basis: false
  prefix_frames: null
training:
  pretrain_epochs: 100
  finetune_epochs: 100
  batch_size: 128
  patience: 10
  num_workers: 4
  seed: 42
  device: cuda
  use_amp: true
  grad_clip: 1.0
  freeze_macro: true
optimizer:
  lr: 0.01
  weight_decay: 0.0001
loss:
  tke_weight: 0.05
  use_tke: false
  vorticity_weight: 0.1
  use_vorticity: true
logging:
  use_tqdm: true
  save_epoch_checkpoints: true
  tensorboard: false
model:
  name: triad-mno
  width: 32
  depth: 3
  heads: 4
  macro_rank: 32
  micro_rank: 32
  use_triad_attn: false
  use_continuous_field: true

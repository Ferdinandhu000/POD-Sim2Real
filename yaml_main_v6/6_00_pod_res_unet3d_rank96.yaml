data:
  use_official_indices: true
  split_mode: official_index
  test_mode: all
  input_steps: 20
  output_steps: 20
  resolution:
  - 64
  - 128
  pod_rank: 96
  pod_fit_samples: 64
  refit_real_basis: false
  prefix_frames: null
  use_joint_basis: true
  normalizer: gaussian

training:
  pretrain_epochs: 200
  finetune_epochs: 200
  batch_size: 8  # Safe default for UNet3D (40 frames temporal_concat) on 80GB GPU.
  patience: 10
  num_workers: 4
  persistent_workers: true
  prefetch_factor: 1
  seed: 42
  device: cuda
  use_amp: true
  grad_clip: 1.0
  freeze_macro: true
  freeze_residual_epochs: 30

optimizer:
  lr: 0.0002
  weight_decay: 0.0001

loss:
  use_tke: false
  use_vorticity: true
  vorticity_weight: 0.1
  v_weight: 3.0
  pod_weight: 0.5

logging:
  use_tqdm: true
  save_epoch_checkpoints: true
  tensorboard: false

model:
  name: pod-res-unet3d
  pod_rank: 96
  pod_width: 32
  pod_depth: 4
  pod_dropout: 0.0
  res_width: 64
  res_dim_mults:
  - 1
  - 2
  - 4
  res_attn_heads: 4
  res_attn_dim_head: 32
  resnet_groups: 8
  dual_stream_mode: temporal_concat
  return_aux: true

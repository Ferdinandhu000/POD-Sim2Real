data:
  use_official_indices: true
  split_mode: official_index
  test_mode: all
  input_steps: 20
  output_steps: 20
  resolution:
  - 64
  - 128
  normalizer: gaussian
  prefix_frames: null
training:
  pretrain_epochs: 200
  finetune_epochs: 200
  batch_size: 128
  patience: 10
  num_workers: 4
  seed: 42
  device: cuda
  use_amp: true
  grad_clip: 1.0
optimizer:
  lr: 0.0002
  weight_decay: 0.0001
loss:
  use_tke: false
  use_vorticity: false
logging:
  use_tqdm: true
  save_epoch_checkpoints: true
  tensorboard: false
model:
  name: itransolver3d
  width: 64
  depth: 4
  heads: 8
  slice_num: 32
  patch_size:
  - 2
  - 2
  use_norm: true
  dropout: 0.0
